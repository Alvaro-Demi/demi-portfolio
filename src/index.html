<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DEMI — Fotografía de conciertos y artistas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Fotografía y videografía: videoclips, conciertos, retratos, reels y eventos. Operador de cámara, editor y piloto de dron."
    />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Dominio: si cambia, actualízalo aquí (canonical y og), en public/robots.txt y en public/sitemap.xml -->
    <link rel="canonical" href="https://demi-web.netlify.app/" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Instagram, LinkedIn…). No ejecutan JS: va aquí, estático -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DEMI" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://demi-web.netlify.app/" />
    <meta property="og:title" content="DEMI — Fotografía & Videografía" />
    <meta
      property="og:description"
      content="Fotografía y videografía: videoclips, conciertos, retratos, reels y eventos. Operador de cámara, editor y piloto de dron."
    />
    <meta property="og:image" content="https://demi-web.netlify.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DEMI, fotografía y videografía, sobre una foto en blanco y negro de un concierto" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Ambas fuentes aparecen en la primera pantalla (DEMI y la navegación) -->
    <link rel="preload" href="/fonts/league-gothic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Foto del hero (LCP): se pide ya, sin esperar a que arranque Angular.
         Debe coincidir con lo que pinta el hero: id de la foto (home.data.ts), anchos (PHOTO_WIDTHS)
         y sizes (HERO_SIZES, en shared/image-loader.ts). Si no coincide, se descargaría dos veces. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="images/photos/hero-640.webp 640w, images/photos/hero-1080.webp 1080w, images/photos/hero-1600.webp 1600w, images/photos/hero-2400.webp 2400w"
      imagesizes="(max-aspect-ratio: 1/1) and (min-resolution: 2.5dppx) 120vw, (max-aspect-ratio: 1/1) 210vw, 100vw"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
