<section class="film" aria-labelledby="film-title">
  <!-- Cabecera como la del resto de secciones: número y categoría, título grande y, a la
       derecha, la pausa (obligatoria: la tira se mueve sola sin parar, WCAG 2.2.2) -->
  <header class="film-header" appReveal>
    <p class="eyebrow">{{ chapter() }} — <span lang="en">Backstage</span></p>
    <h2 id="film-title" class="film-title">Detrás de las cámaras</h2>
    @if (!reducedMotion()) {
      <button type="button" class="film-toggle" (click)="toggle()">
        {{ userPaused() ? 'Reproducir' : 'Pausar' }}<span class="visually-hidden"> la tira de fotos</span>
      </button>
    }
  </header>

  <!-- Escenario: la tira gira dentro; su radio y su giro llegan como variables CSS.
       Se puede arrastrar con el ratón o deslizar con el dedo (ver film-strip.ts). -->
  <div
    class="film-stage"
    #stage
    (pointerenter)="hover($event, true)"
    (pointerleave)="hover($event, false)"
  >
    <div class="film-scene">
      <div class="film-ring" #ring [style.--film-r]="layout().radius">
        @if (near()) {
          @for (card of layout().cards; track $index) {
            <div
              class="film-frame"
              [style.--a.deg]="card.angle"
              [style.--w]="card.width"
              [attr.aria-hidden]="card.copy > 0 ? 'true' : null"
            >
              <div class="film-photo">
                <img
                  [ngSrc]="card.frame.src"
                  [alt]="card.copy === 0 ? card.frame.alt : ''"
                  fill
                  sizes="(min-width: 64rem) 30vw, (min-width: 48rem) 42vw, 68vw"
                  loading="eager"
                  draggable="false"
                  [style.object-position]="card.frame.focus ?? null"
                />
              </div>
            </div>
          }
        }
      </div>
    </div>
  </div>
</section>
