<section id="archivo" class="reel" aria-labelledby="reel-title">
  <header class="reel-header" appReveal>
    <p class="eyebrow">{{ chapter() }} — Archivo</p>
    <h2 id="reel-title" class="reel-title">En movimiento</h2>
    <p class="reel-intro">Retratos, directos, rodajes y viajes: todo lo que ha pasado por la cámara.</p>
  </header>

  <div class="reel-stage" appReveal [revealDelay]="120">
    <!-- Las fotos ya aparecen en otras secciones: aquí la animación se describe entera -->
    <div
      class="reel-track"
      #track
      role="img"
      aria-label="Animación: fotografías del archivo pasan en diagonal como tarjetas; retratos, conciertos, rodajes y viajes"
      [attr.data-phase]="phase() ? 'b' : 'a'"
    >
      @if (near()) {
        @for (card of slots(); track card.i) {
          <div class="reel-card" [attr.data-slot]="card.slot">
            <img
              [ngSrc]="card.photo.src"
              alt=""
              fill
              sizes="(min-width: 64rem) 18vw, (min-width: 48rem) 26vw, 34vw"
              loading="eager"
              [style.object-position]="card.photo.focus ?? null"
            />
          </div>
        }
      }
    </div>

    <div class="reel-controls">
      <p class="reel-count" aria-hidden="true">
        {{ label(active()) }} <span>/ {{ label(count() - 1) }}</span>
      </p>
      @if (!reducedMotion()) {
        <button type="button" class="reel-toggle" (click)="toggle()">
          {{ userPaused() ? 'Reproducir' : 'Pausar' }}<span class="visually-hidden"> la animación</span>
        </button>
      }
    </div>
  </div>
</section>
